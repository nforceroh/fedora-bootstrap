# Inventory for fedora-bootstrap.
# Run on each machine with: ansible-playbook -K -i inventory.ini initial_setup.yml
# The playbook targets the group matching the local hostname, or all hosts
# when run with --limit.

[optimus]
optimus ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[raider]
raider ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[fedora:children]
optimus
raider
