---
# tasks file for vscode

# Configure VS Code repository and import its GPG key using Ansible modules
- name: Import VS Code GPG key
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Configure VS Code yum repository
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Install VS Code package using dnf
  ansible.builtin.dnf:
    name: code
    state: present
    update_cache: true # Updates package cache and installs 'code'
