---
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/bin"
    state: directory
    owner: "{{ target_user }}"
    mode: "0755"

- name: Ensure ~/.cache exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.cache"
    state: directory
    owner: "{{ target_user }}"
    mode: "0700"

- name: Ensure ~/.config/autostart exists
  ansible.builtin.file:
    path: "{{ autostart_dir }}"
    state: directory
    owner: "{{ target_user }}"
    mode: "0755"

- name: Deploy reset-mouse-profile.sh
  ansible.builtin.template:
    src: "{{ role_path }}/files/reset-mouse-profile.sh"
    dest: "{{ script_path }}"
    owner: "{{ target_user }}"
    mode: "0755"

- name: Deploy World of Tanks launcher
  ansible.builtin.copy:
    src: wot-launcher.sh
    dest: "{{ wot_launcher_path }}"
    owner: "{{ target_user }}"
    mode: "0755"

- name: Deploy reset-mouse-profile.desktop autostart entry
  ansible.builtin.copy:
    dest: "{{ desktop_file_path }}"
    owner: "{{ target_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Exec={{ script_path }} {{ mouse_profile }}
      Hidden=false
      NoDisplay=false
      X-GNOME-Autostart-enabled=true
      Name=Reset G502 Mouse Profile
      Comment=Initializes Logitech G502 profile to the desktop profile at login

- name: Deploy PowerPlay udev rule
  ansible.builtin.copy:
    dest: "{{ udev_rules_path }}"
    mode: "0644"
    content: >-
      ACTION=="bind", SUBSYSTEM=="hid", ENV{HID_ID}=="{{ g502_hid_id }}", RUN+="{{ script_path }}"
  notify:
    - Reload udev rules
    - Trigger udev rules

- name: Check the mouse profile script
  ansible.builtin.command: "{{ script_path }} {{ mouse_profile }}"
  register: mouse_script_result
  changed_when: false
  failed_when: false

- name: Report mouse profile script result
  ansible.builtin.debug:
    msg: >-
      Mouse profile script exited with code {{ mouse_script_result.rc }}.
      The mouse may be disconnected while the KVM is switched away.
